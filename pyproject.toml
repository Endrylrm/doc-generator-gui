[project]
name = "doc-generator-gui"
version = "0.1.0"
description = "Gerador de termos para empresas."
authors = [{ name = "Endryl Richard Monteiro", email = "endrylrm@hotmail.com" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jinja2>=3.1.6",
    "playwright>=1.64.1",
    "PySide6>=6.12.0,<7",
]

[project.scripts]
main = "doc_generator_gui.main:main"

[dependency-groups]
dev = [
    "imageio>=2.38.1",
    "Nuitka>=4.3.5,<5",
    "pyinstaller>=6.22.3,<7",
    "pytest>=9.2.0,<10",
    "pytest-qt>=4.5.0,<5",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
